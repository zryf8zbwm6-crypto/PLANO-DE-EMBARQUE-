<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Plano de Embarque GTOP 34</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f4f5f7;--card:#fff;--tx:#14213d;--mut:#667085;--bd:#d0d5dd;--ac:#1d4ed8;--dg:#b42318}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1116;--card:#171b22;--tx:#e6e9ef;--mut:#98a2b3;--bd:#2c333d;--ac:#6ea0ff;--dg:#f97066}}
:root[data-theme="dark"]{--bg:#0e1116;--card:#171b22;--tx:#e6e9ef;--mut:#98a2b3;--bd:#2c333d;--ac:#6ea0ff;--dg:#f97066}
html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,sans-serif}
main{max-width:640px;margin:0 auto;padding:12px}
h1{font-size:18px;margin:4px 0 12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:12px}
label{font-size:12px;color:var(--mut);display:block;margin-bottom:2px}
input,select,textarea{width:100%;box-sizing:border-box;padding:9px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
textarea{min-height:200px;font-size:13px}
.g{display:grid;gap:8px}.g2{grid-template-columns:1fr 1fr}.f{grid-column:1/-1}
.sl{border-top:1px dashed var(--bd);margin-top:10px;padding-top:8px;display:grid;gap:6px;grid-template-columns:46px 1fr 1fr}
.sl b{align-self:center;font-size:13px}
.sl .n{grid-column:2/4}.sl .c2{grid-column:2}
button{border:0;border-radius:8px;padding:10px 12px;font:inherit;font-weight:600;cursor:pointer;background:var(--bd);color:var(--tx)}
.pri{background:var(--ac);color:#fff;width:100%;padding:14px}.rm{background:none;color:var(--dg)}
.bar{display:flex;gap:8px}.bar button{flex:1}
.msg{font-size:13px;color:var(--mut);text-align:center;min-height:18px}
summary{cursor:pointer;font-weight:600}
</style></head><body><main>
<h1>⚡️ PLANO DE EMBARQUE GTOP 34 ⚡️</h1>
<div class="card g g2">
 <div><label>Equipe</label><input id="equipe" placeholder="GTOP 34"></div>
 <div><label>Dia</label><input type="date" id="data"></div>
 <div class="f"><label>Horário</label><input id="horario" placeholder="15:00 às 03:00"></div>
 <div class="f"><label>Obs./faltas</label><input id="obs"></div>
 <div class="f"><label>Batalhão (fixo)</label><input id="unidade" readonly style="opacity:.7"></div>
</div>
<div id="vtrs"></div>
<div class="bar"><button id="addv" onclick="addVtr()">+ Viatura</button><button onclick="limpar()">Limpar policiais</button></div>
<div class="card g" style="margin-top:12px"><div><label>CMT da equipe (rodapé)</label><select id="cmtEq"></select></div></div>
<button class="pri" onclick="gerar()">Gerar PDF</button>
<p class="msg" id="msg"></p>
<details class="card"><summary id="lsum">Lista de policiais</summary>
 <p style="font-size:13px;color:var(--mut)">Um por linha: <b>GRAD NOME - MATRÍCULA - TELEFONE</b>. Para atualizar, edite ou cole a lista nova e salve.</p>

const K='pe3_state',R='pe3_roster',LB=['CMT','MOT','PAT','PAT'],CALL=['ALFA','BRAVO','CHARLIE','DELTA'];
const DEF=``;
const $=i=>document.getElementById(i);
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const up=s=>String(s||'').trim().toUpperCase();
const sl=()=>({nome:'',mat:'',cel:'',man:false});
const mkV=i=>({call:CALL[i]||'',vtr:'',s:[sl(),sl(),sl(),sl()]});
function parse(t){return t.split(/\n/).map(l=>l.trim()).filter(Boolean).map(l=>{const p=l.split(/\s+-\s+/);return{nome:up(p[0]),mat:(p[1]||'').trim(),cel:p.slice(2).join(' - ').replace(/-\s+/g,'-').trim()}}).filter(r=>r.nome)}
let roster=parse(DEF);
try{const s=localStorage.getItem(R);if(s){const t=JSON.parse(s);if(t.length)roster=t}}catch(e){}
let S={equipe:'',data:'',horario:'',obs:'',unidade:'14º BATALHÃO DE POLÍCIA MILITAR',cmtEq:'',vtrs:[mkV(0),mkV(1),mkV(2)]};
try{S=Object.assign(S,JSON.parse(localStorage.getItem(K)||'{}'))}catch(e){}
S.data=new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,10);S.horario='15:00 às 03:00';S.unidade='14º BATALHÃO DE POLÍCIA MILITAR';if(!S.equipe)S.equipe='GTOP 34';
function save(){try{localStorage.setItem(K,JSON.stringify(S));localStorage.setItem(R,JSON.stringify(roster))}catch(e){}}
['equipe','data','horario','obs','unidade'].forEach(k=>{$(k).value=S[k]||'';$(k).addEventListener('input',e=>{S[k]=e.target.value;save()});$(k).addEventListener('change',e=>{S[k]=e.target.value;save()})});
$('cmtEq').onchange=e=>{S.cmtEq=e.target.value;save()};
function opts(p,used){return '<option value="">— selecionar —</option>'+roster.filter(r=>!used.has(r.nome)||(r.nome===p.nome&&!p.man)).map(r=>`<option value="${esc(r.nome)}"${p.nome===r.nome&&!p.man?' selected':''}>${esc(r.nome)}</option>`).join('')+`<option value="__m"${p.man?' selected':''}>Outro (digitar)…</option>`}
function render(){
 const used=new Set();S.vtrs.forEach(v=>v.s.forEach(p=>{if(p.nome&&!p.man)used.add(p.nome)}));
 $('vtrs').innerHTML=S.vtrs.map((v,i)=>`<div class="card"><div class="g g2"><div><label>Indicativo</label><input value="${esc(v.call)}" oninput="S.vtrs[${i}].call=this.value;save()"></div><div><label>VTR</label><input inputmode="numeric" value="${esc(v.vtr)}" oninput="S.vtrs[${i}].vtr=this.value;save()"></div></div>`+
 v.s.map((p,j)=>`<div class="sl"><b>${LB[j]}</b><select class="n" onchange="pick(${i},${j},this.value)">${opts(p,used)}</select>${p.man?`<input class="n" placeholder="Posto + nome" value="${esc(p.nome)}" oninput="S.vtrs[${i}].s[${j}].nome=this.value;save()">`:''}<div class="c2"><input placeholder="Matrícula" value="${esc(p.mat)}" oninput="S.vtrs[${i}].s[${j}].mat=this.value;save()"></div><div><input placeholder="Celular" inputmode="tel" value="${esc(p.cel)}" oninput="S.vtrs[${i}].s[${j}].cel=this.value;save()"></div></div>`).join('')+
 `<div class="bar" style="margin-top:8px"><button class="rm" onclick="delVtr(${i})">Remover viatura</button></div></div>`).join('');
 $('addv').style.display=S.vtrs.length>=4?'none':'';
 $('cmtEq').innerHTML='<option value="">(CMT da 1ª viatura)</option>'+roster.map(r=>`<option value="${esc(r.nome)}"${S.cmtEq===r.nome?' selected':''}>${esc(r.nome)}</option>`).join('');
 $('lista').value=roster.map(r=>`${r.nome} - ${r.mat} - ${r.cel}`).join('\n');$('lsum').textContent=`Lista de policiais (${roster.length})`}
function pick(i,j,v){const p=S.vtrs[i].s[j];
 if(v==='__m'){Object.assign(p,{man:true,nome:'',mat:'',cel:''})}
 else if(!v){Object.assign(p,{man:false,nome:'',mat:'',cel:''})}
 else{const r=roster.find(x=>x.nome===v);if(r)Object.assign(p,{man:false,nome:r.nome,mat:r.mat,cel:r.cel})}
 save();render()}
function addVtr(){S.vtrs.push(mkV(S.vtrs.length));save();render()}
function delVtr(i){S.vtrs.splice(i,1);save();render()}
function limpar(){if(confirm('Limpar os policiais de todas as viaturas?')){S.vtrs.forEach(v=>v.s=[sl(),sl(),sl(),sl()]);save();render()}}
function salvaLista(){const r=parse($('lista').value);if(!r.length){say('Lista vazia, não salvei.');return}roster=r;
 S.vtrs.forEach(v=>v.s.forEach(p=>{if(!p.man&&p.nome&&!roster.some(x=>x.nome===p.nome))Object.assign(p,sl())}));save();render();say('Lista salva ✅')}
